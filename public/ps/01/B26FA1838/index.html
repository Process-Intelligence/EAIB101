<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цалингийн Татвар & НДШ — 5 Шалгах Тооцоо</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Таван Шалгах Тооцооны Хуудас</h1>
            <p class="text-slate-500 text-sm mt-1">Гараар бодсон бодолт болон алгоритмын бодолтын харьцуулалт</p>
        </header>

        <!-- 5 Test Cases Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-xl font-bold text-slate-900 border-b pb-3">Таван Шалгах Тооцооны Нэгтгэл</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-700">
                            <th class="p-3">Шалгах Нөхцөл</th>
                            <th class="p-3 text-right">Үндсэн цалин</th>
                            <th class="p-3 text-right">НДШ (11.5%)</th>
                            <th class="p-3 text-right">Татвар бодогдох</th>
                            <th class="p-3 text-right">Хөнгөлөлт</th>
                            <th class="p-3 text-right">ХХОАТ</th>
                            <th class="p-3 text-right font-bold text-blue-600">Гар дээр авах</th>
                        </tr>
                    </thead>
                    <tbody id="testTableBody" class="divide-y divide-slate-100">
                        <!-- JS Inserted Content -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Interactive Calculator -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 border-b pb-3 mb-4">Интерактив Тооцоолуур</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Үндсэн цалин оруулна уу (₮)</label>
                    <input type="number" id="customInput" value="2000000" oninput="runCustomCalc()" 
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold text-slate-800">
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-center">
                    <span class="text-xs text-slate-500 font-medium uppercase">Гар дээр авах цалин</span>
                    <span id="customResult" class="text-3xl font-bold text-blue-600">0 ₮</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const MIN_WAGE = 792000;
        const NDS_CAP = MIN_WAGE * 10; // 7,920,000 ₮

        const cases = [
            { name: "1. Татвар нь тэг болох цалин", salary: 225988.70 },
            { name: "2. Дунд түвшний энгийн цалин", salary: 2000000 },
            { name: "3. Шатлалын зааг дээр яг таарсан", salary: 11299435.03 },
            { name: "4. Шимтгэлийн дээд хязгаараас өндөр", salary: 15000000 },
            { name: "5. Тэг цалин", salary: 0 }
        ];

        function calculateAll(gross) {
            // 1. НДШ бодох (Дээд хязгаар 7,920,000₮)
            const ndsBase = Math.min(gross, NDS_CAP);
            const nds = ndsBase * 0.115;

            // 2. Татвар бодогдох орлого
            const taxable = Math.max(0, gross - nds);

            // 3. ХХОАТ Шаталсан бодолт
            let grossTax = 0;
            if (taxable <= 10000000) {
                grossTax = taxable * 0.10;
            } else if (taxable <= 15000000) {
                grossTax = 1000000 + ((taxable - 10000000) * 0.15);
            } else {
                grossTax = 1750000 + ((taxable - 15000000) * 0.20);
            }

            // 4. Татварын сарын хөнгөлөлт
            let discount = 0;
            if (gross > 0) {
                if (gross <= 2400000) discount = 20000;
                else if (gross <= 3600000) discount = 16000;
                else if (gross <= 4800000) discount = 12000;
                else if (gross <= 6000000) discount = 8000;
                else discount = 0;
            }

            discount = Math.min(grossTax, discount);
            const netTax = Math.max(0, grossTax - discount);
            const netSalary = gross - nds - netTax;

            return { gross, nds, taxable, discount, netTax, netSalary };
        }

        function fmt(num) {
            return new Intl.NumberFormat('mn-MN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num) + " ₮";
        }

        function renderCases() {
            const tbody = document.getElementById('testTableBody');
            tbody.innerHTML = cases.map(c => {
                const res = calculateAll(c.salary);
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-medium text-slate-800">${c.name}</td>
                        <td class="p-3 text-right font-mono">${fmt(res.gross)}</td>
                        <td class="p-3 text-right font-mono text-rose-600">-${fmt(res.nds)}</td>
                        <td class="p-3 text-right font-mono">${fmt(res.taxable)}</td>
                        <td class="p-3 text-right font-mono text-emerald-600">-${fmt(res.discount)}</td>
                        <td class="p-3 text-right font-mono text-rose-600">-${fmt(res.netTax)}</td>
                        <td class="p-3 text-right font-mono font-bold text-blue-600">${fmt(res.netSalary)}</td>
                    </tr>
                `;
            }).join('');
        }

        function runCustomCalc() {
            const val = parseFloat(document.getElementById('customInput').value) || 0;
            const res = calculateAll(val);
            document.getElementById('customResult').innerText = fmt(res.netSalary);
        }

        renderCases();
        runCustomCalc();
    </script>
</body>
</html>
