<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B26FA1897 — Нинжин.Х | EAIB101</title>
<meta name="description" content="EAIB101 хичээлийн оюутан Нинжин.Х (B26FA1897) — ажлын хуудас.">
<style>
*, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg: #f4f4f2;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6963;
    --line: #e2e1dc;
    --accent: #b4522a;
    --accent-soft: #fbeee7;
    --shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px -12px rgba(28,27,25,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f;
      --panel: #1e1e18;
      --ink: #f0efe9;
      --muted: #a09d94;
      --line: #32312a;
      --accent: #e8875c;
      --accent-soft: #2e211a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  code, .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  a { color: var(--accent); }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2rem;
    box-shadow: var(--shadow);
  }
  .badge {
    display: inline-block;
    font-size: .8125rem;
    letter-spacing: .08em;
    padding: .3rem .6rem;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--line);
  }
  h1 { font-size: clamp(1.6rem, 5vw, 2.25rem); margin: 1rem 0 .25rem; line-height: 1.2; }
  .sub { color: var(--muted); margin: 0 0 1.75rem; }
  .notice {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    background: var(--bg);
  }
  .notice p { margin: 0 0 .6rem; }
  .notice p:last-child { margin-bottom: 0; }
  .path {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
    padding: .5rem .7rem;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--ink);
    font-size: .875rem;
  }
  footer { margin-top: 2rem; font-size: .9375rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <span class="badge mono">B26FA1897</span>
      <h1>Нинжин.Х</h1>
      <p class="sub">EAIB101 — оюутны ажлын хуудас</p>

      <div class="notice">
        <p><strong>Түр зуурын хуудас.</strong> Энэ оюутан ажлаа хараахан илгээгээгүй байна.</p>
        <p>Өөрийн HTML-ээ байршуулахдаа дараах файлыг бүхэлд нь солино уу:</p>
        <code class="path">public/student/B26FA1897/index.html</code>
      </div>

      <footer><a href="/">← Ангийн бүх оюутан</a></footer>
    </article>
  </main>
</body>
</html>
