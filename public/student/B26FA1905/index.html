<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цалин, Татвар, Шимтгэл Тооцоолуур - B26FA1905</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .student-id {
            text-align: center;
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .result {
            margin-top: 24px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .result-item:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .result-item span:last-child {
            font-weight: 600;
            color: var(--text-main);
        }
        
        .result-item:last-child span:last-child {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Цалин Тооцоолуур</h2>
    <div class="student-id">Оюутны код: B26FA1905</div>
    
    <div class="form-group">
        <label for="grossSalary">Сарын нийт цалин (Gross Salary)</label>
        <input type="number" id="grossSalary" placeholder="Жишээ: 2000000" value="2000000" oninput="calculateSalary()">
    </div>

    <div class="result" id="resultBox">
        <div class="result-item">
            <span>Нийгмийн даатгал (11.5%):</span>
            <span><span id="ndsh">0</span> ₮</span>
        </div>
        <div class="result-item">
            <span>Татвар ногдох орлого:</span>
            <span><span id="taxableIncome">0</span> ₮</span>
        </div>
        <div class="result-item">
            <span>ХХОАТ (10%):</span>
            <span><span id="xhoat">0</span> ₮</span>
        </div>
        <div class="result-item">
            <span>Гар дээр олгох цалин:</span>
            <span><span id="netSalary">0</span> ₮</span>
        </div>
    </div>
</div>

<script>
    function calculateSalary() {
        let gross = parseFloat(document.getElementById('grossSalary').value) || 0;

        // Хуулийн дагуух суутгалууд (НДШ 11.5%, ХХОАТ 10%)
        let ndsh = gross * 0.115;
        let taxableIncome = gross - ndsh;
        let xhoat = taxableIncome * 0.10;
        let netSalary = taxableIncome - xhoat;

        // Үр дүнг дэлгэцэнд харуулах
        document.getElementById('ndsh').innerText = ndsh.toLocaleString();
        document.getElementById('taxableIncome').innerText = taxableIncome.toLocaleString();
        document.getElementById('xhoat').innerText = xhoat.toLocaleString();
        document.getElementById('netSalary').innerText = netSalary.toLocaleString();
    }

    // Хуудас ачаалахад шууд тооцоолох
    window.onload = calculateSalary;
</script>

</body>
</html>
