<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Хуудас олдсонгүй | EAIB101</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg: #f4f4f2;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6963;
    --line: #e2e1dc;
    --accent: #b4522a;
    --accent-soft: #fbeee7;
    --shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px -12px rgba(28,27,25,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f;
      --panel: #1e1e18;
      --ink: #f0efe9;
      --muted: #a09d94;
      --line: #32312a;
      --accent: #e8875c;
      --accent-soft: #2e211a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  code, .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  a { color: var(--accent); }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 5rem 1.25rem; text-align: center; }
  .code404 { font-size: 4rem; font-weight: 700; color: var(--accent); margin: 0; line-height: 1; }
  h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
  p { color: var(--muted); margin: 0 0 2rem; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="code404 mono">404</p>
    <h1>Хуудас олдсонгүй</h1>
    <p>Хайсан хуудас байхгүй эсвэл хаяг буруу байна.</p>
    <p><a href="/">← Ангийн бүх оюутан</a></p>
  </main>
</body>
</html>
